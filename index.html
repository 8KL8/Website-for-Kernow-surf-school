<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernow Bookingt</title>

    <!-- STYLESHEETS -->

    <!-- JS SCRIPTS -->

    <!-- NEW SECTION -->
    <script src="scripts/kernow-script-booking-people-details.js" defer></script>
    <!-- NEW SECTION END -->

</head>
<body>
    
    <h1>Kernow Surf School</h1>

    <h3>Ride any wave with Kernow</h3>

    <p>Welcome to the booking section. 
        Here you can book Group, Private
        or Family sessions.
    </p>

    <form>
        <!-- NEW SECTION -->

        <h4>Booking Details</h4>

        
        <p>Name: <input type="text" placeholder="Full Name" id="name"></p>
        
        <label>session:</label>
        <select id="session" onchange="updatePeople()">

            <option value="">Select An Option</option>

            <option value="group">Group</option>
            <option value="private">Private</option>
            <option value="family">Family</option>

        </select>

        <br><br>

        <label for="people">people:</label>
        <input 
            type="number"
            id="people" 
            placeholder="E.g. 1"
            min="1"
            max="8"
            disabled
        >

        <br><br>

        <button type="button" id="Submit">Submit</button>
    </form>
    
    <p id="reciept"></p>

    <!-- NEW SECTION END -->
</body>
</html>
